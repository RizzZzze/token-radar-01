<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Radar — pre-token protocols ranked by implied value</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header class="band">
  <div class="wrap">
    <h1>TOKEN RADAR</h1>
    <p id="subtitle">Ranking protocols not recorded as having a token, by the implied value of a future launch — with a farm plan for each one.</p>
  </div>
  <nav class="tabs" aria-label="Views">
    <a href="#board" data-view="board">Board</a>
    <a href="#filtered" data-view="filtered">Filtered</a>
    <a href="#method" data-view="method">Method</a>
    <a href="#live" data-view="live">Live tokens</a>
  </nav>
</header>
<main class="wrap" id="view">
  <div class="card"><p>Loading the radar…</p></div>
</main>
<footer class="wrap" id="foot"></footer>
<noscript><p style="padding:0 20px">This dashboard needs JavaScript: it refits the value curve in your browser from the snapshot data.</p></noscript>
<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
